<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 阿秋的下载站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei",sans-serif}
        body{background:#f5f7fa;padding:20px;max-width:900px;margin:0 auto}
        .box{background:#fff;border-radius:12px;padding:25px;box-shadow:0 2px 10px #00000008}
        h1{text-align:center;color:#333;margin-bottom:20px;font-size:24px}
        .cate{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
        .cate button{padding:8px 14px;border:none;border-radius:6px;background:#f1f1f1;cursor:pointer}
        .cate button.active{background:#007bff;color:#fff}
        .item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f9f9f9;border-radius:8px;margin:8px 0}
        .down{padding:6px 12px;background:#007bff;color:#fff;border-radius:4px;text-decoration:none}
        .empty{text-align:center;color:#999;padding:30px}
    </style>
</head>
<body>
<div class="box">
    <h1>📁 阿秋的下载站</h1>

    <div class="cate">
        <button class="active" onclick="show('all')">全部</button>
        <button onclick="show('软件')">软件</button>
        <button onclick="show('文档')">文档</button>
        <button onclick="show('视频')">视频</button>
        <button onclick="show('图片')">图片</button>
    </div>

    <div id="list"></div>
</div>

<script>
// ==============================================
// ============ 所有文件都写在这里 ===============
// ========= 增删文件直接改这里即可 =============
// ==============================================
const files = [
  { cate: "视频", name: "25工业大数据", url: "https://1829798478.share.123865.com/123pan/Kk8ejv-MV5wH" },
];

let current = "all";

// 渲染页面
function render() {
  let el = document.getElementById("list");
  let data = current === "all" ? files : files.filter(i => i.cate === current);
  
  if (data.length === 0) {
    el.innerHTML = "<div class='empty'>暂无文件</div>";
    return;
  }

  let html = "";
  data.forEach(i => {
    html += `
    <div class="item">
      <div>${i.name}</div>
      <div><a class="down" href="${i.url}" target="_blank">下载</a></div>
    </div>`;
  });
  el.innerHTML = html;
}

// 切换分类
function show(cate) {
  current = cate;
  render();
  document.querySelectorAll(".cate button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
}

// 初始化
render();
</script>
</body>
</html>
