<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>私人文件下载</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
        body{background:#f5f7fa;padding:30px;max-width:800px;margin:0 auto}
        .card{background:white;padding:30px;border-radius:12px;box-shadow:0 2px 10px #00000010}
        h2{text-align:center;margin-bottom:20px}
        .login{text-align:center;margin-bottom:20px}
        #pwd{padding:10px;width:200px;border:1px solid #ddd;border-radius:6px}
        #loginBtn{padding:10px 20px;background:#409eff;color:white;border:0;border-radius:6px;margin-left:5px;cursor:pointer}
        .upload{display:none;border:2px dashed #409eff;padding:25px;text-align:center;border-radius:8px;margin-bottom:20px}
        #fileInput{display:none}
        .upBtn{background:#409eff;color:white;padding:10px 20px;border-radius:6px;cursor:pointer}
        .file{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f8f9fa;border-radius:6px;margin:8px 0}
        .down{background:#67c23a;color:white;padding:6px 12px;text-decoration:none;border-radius:4px}
        .del{background:#f56c6c;color:white;padding:6px 12px;border:0;border-radius:4px;margin-left:6px;cursor:pointer}
        .empty{text-align:center;color:#999;padding:20px}
    </style>
</head>
<body>
<div class="card">
    <h2>私人文件下载页</h2>
    <div class="login">
        <input type="password" id="pwd" placeholder="输入管理密码">
        <button id="loginBtn">登录</button>
    </div>
    <div class="upload" id="uploadBox">
        <label class="upBtn" for="fileInput">选择文件上传</label>
        <input type="file" id="fileInput" multiple>
    </div>
    <div id="fileList"></div>
</div>

<script>
// ========== 你的密码 ==========
const PASSWORD = "123456";
// =============================

let isAdmin = false;
let files = JSON.parse(localStorage.getItem("myFiles")) || [];

// 渲染列表
function render() {
    let list = document.getElementById("fileList");
    if (files.length === 0) {
        list.innerHTML = "<div class='empty'>暂无文件</div>";
        return;
    }
    let html = "";
    files.forEach((item, i) => {
        html += `
        <div class="file">
            <span>${item.name}</span>
            <div>
                <a class="down" href="${item.url}" download="${item.name}">下载</a>
                ${isAdmin ? '<button class="del" onclick="del('+i+')">删除</button>' : ''}
            </div>
        </div>`;
    });
    list.innerHTML = html;
}

// 删除
window.del = (i) => {
    files.splice(i, 1);
    localStorage.setItem("myFiles", JSON.stringify(files));
    render();
}

// 登录
document.getElementById("loginBtn").onclick = () => {
    if (document.getElementById("pwd").value === PASSWORD) {
        isAdmin = true;
        document.getElementById("uploadBox").style.display = "block";
        alert("登录成功！");
        render();
    } else {
        alert("密码错误");
    }
}

// 上传
document.getElementById("fileInput").onchange = (e) => {
    for (let f of e.target.files) {
        let url = URL.createObjectURL(f);
        files.push({ name: f.name, url: url });
    }
    localStorage.setItem("myFiles", JSON.stringify(files));
    render();
}

// 初始化
render();
</script>
</body>
</html>
