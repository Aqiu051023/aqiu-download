<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人文件下载页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .login-box {
            text-align: center;
            margin-bottom: 25px;
        }
        #pwd {
            padding: 10px 15px;
            width: 220px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        #loginBtn {
            padding: 10px 20px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 8px;
        }
        .upload-area {
            display: none;
            border: 2px dashed #409eff;
            padding: 25px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #fileInput { display: none; }
        .upload-btn {
            background: #409eff;
            color: white;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #fafafa;
            border-radius: 6px;
            margin: 8px 0;
        }
        .down {
            background: #67c23a;
            color: white;
            padding: 6px 14px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .del {
            background: #f56c6c;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 6px;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>私人文件下载中心</h2>

        <div class="login-box">
            <input type="password" id="pwd" placeholder="请输入管理密码">
            <button id="loginBtn">登录管理</button>
        </div>

        <div class="upload-area" id="uploadArea">
            <p>✅ 管理员已登录，可上传/删除文件</p>
            <p style="color:red;margin-top:8px">⚠️ 仅支持小文件（图片/文本/PDF，小于 5MB）</p>
            <br>
            <label class="upload-btn" for="fileInput">选择文件上传</label>
            <input type="file" id="fileInput" multiple>
        </div>

        <div id="fileList" class="empty">暂无文件</div>
    </div>

<script>
// ====================== 配置区 ======================
const ADMIN_PASSWORD = "123456";  // 你的管理密码
const FILE_LIST_KEY = "my-online-files"; // 存储key
// ====================================================

let isAdmin = false;
let fileList = JSON.parse(localStorage.getItem(FILE_LIST_KEY)) || [];

// 渲染文件列表
function renderFileList() {
    const container = document.getElementById("fileList");
    if (fileList.length === 0) {
        container.innerHTML = '<div class="empty">暂无文件</div>';
        return;
    }

    let html = "";
    fileList.forEach((item, index) => {
        html += `
        <div class="file-item">
            <span>${item.name}</span>
            <div>
                <a class="down" href="${item.base64}" download="${item.name}">下载</a>
                ${isAdmin ? `<button class="del" onclick="deleteFile(${index})">删除</button>` : ''}
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

// 删除文件
window.deleteFile = function(index) {
    if (!isAdmin) return;
    fileList.splice(index, 1);
    saveToLocal();
    renderFileList();
};

// 保存到本地存储
function saveToLocal() {
    localStorage.setItem(FILE_LIST_KEY, JSON.stringify(fileList));
}

// 登录
document.getElementById("loginBtn").addEventListener("click", () => {
    if (document.getElementById("pwd").value === ADMIN_PASSWORD) {
        isAdmin = true;
        document.getElementById("uploadArea").style.display = "block";
        alert("✅ 登录成功！");
        renderFileList();
    } else {
        alert("❌ 密码错误！");
    }
});

// 上传文件（永久保存）
document.getElementById("fileInput").addEventListener("change", (e) => {
    if (!isAdmin) return;
    
    const files = e.target.files;
    if (files.length === 0) return;

    for (const file of files) {
        const reader = new FileReader();
        reader.onload = (event) => {
            fileList.push({
                name: file.name,
                base64: event.target.result
            });
            saveToLocal();
            renderFileList();
        };
        reader.readAsDataURL(file);
    }
    e.target.value = "";
});

// 初始化页面
renderFileList();
</script>
</body>
</html>
